name: GitHub Metrics

on:
  schedule:
    - cron: "0 2 * * *"   # Runs every day at 2 AM UTC
  workflow_dispatch:        # Allows manual trigger from Actions tab
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📊 Full Metrics (Overview + Habits + Languages)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg

          # ── BASE CONFIG ──────────────────────────────────────────
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata

          # ── PLUGIN: Isometric Contribution Calendar ──────────────
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # ── PLUGIN: Coding Languages ────────────────────────────
          plugin_languages: yes
          plugin_languages_ignored: html, css, dockerfile
          plugin_languages_limit: 10
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_recent_days: 14

          # ── PLUGIN: Coding Habits & Schedule ────────────────────
          plugin_habits: yes
          plugin_habits_from: 500
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugin_habits_trim: yes

          # ── PLUGIN: Starred Topics ──────────────────────────────
          plugin_topics: yes
          plugin_topics_limit: 18
          plugin_topics_mode: icons
          plugin_topics_sort: stars

          # ── PLUGIN: Notable Contributions ───────────────────────
          plugin_notable: yes
          plugin_notable_from: all
          plugin_notable_types: commit

          # ── PLUGIN: GitHub Achievements ─────────────────────────
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0

          # ── PLUGIN: Repository Traffic ──────────────────────────
          plugin_traffic: yes

          # ── PLUGIN: Reactions ───────────────────────────────────
          plugin_reactions: yes
          plugin_reactions_limit: 200
          plugin_reactions_details: percentage, count
          plugin_reactions_ignored: YOUR_USERNAME

          # ── OUTPUT ──────────────────────────────────────────────
          output_action: commit
          committer_message: "chore: update github metrics [skip ci]"

      - name: 🗓️ Isometric Calendar Only (for compact section)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-iso.svg
          user: ${{ github.repository_owner }}
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          config_timezone: Asia/Kolkata
          output_action: commit
          committer_message: "chore: update iso calendar [skip ci]"
